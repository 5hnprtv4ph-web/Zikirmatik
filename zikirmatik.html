<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Zikirmatik</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--text:#17231d;--muted:#718078;--line:#e5ebe6;--accent:#168568;--accent2:#dff4eb;--soft:#f7faf8;--shadow:0 12px 34px rgba(21,49,37,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:.2s}
body.dark{--bg:#0b1512;--card:#14221c;--text:#edf7f0;--muted:#a1b2a8;--line:#293b32;--accent:#51c49c;--accent2:#1d3d31;--soft:#192a22;--shadow:0 12px 34px rgba(0,0,0,.2)}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:680px;margin:auto;padding:22px 16px 44px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent2);display:grid;place-items:center;font-size:22px}
h1{font-size:21px;margin:0;letter-spacing:-.5px} .sub{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn,.smallbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
select,input[type=number],input[type=text]{background:var(--soft);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;outline:none;min-width:0}
select{max-width:65%;font-weight:600}
.countarea{text-align:center;padding:25px 5px 17px}
.count{font-size:clamp(58px,17vw,88px);line-height:1.05;font-weight:750;letter-spacing:-4px;font-variant-numeric:tabular-nums;margin:12px 0;color:var(--text)}
.goaltext{font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--soft);border-radius:20px;overflow:hidden;margin:17px 4px 5px}
.progress>div{height:100%;width:0;background:var(--accent);border-radius:20px;transition:width .2s}
.actions{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;margin-top:20px}
.action{border:0;border-radius:17px;padding:17px 8px;font-weight:750;font-size:16px}
.minus{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.plus{background:var(--accent);color:white;font-size:19px;box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
.reset{background:var(--accent2);color:var(--accent);border:0;border-radius:12px;padding:10px 13px;font-weight:650}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tools button{font-size:12px;padding:9px 11px}
.sectiontitle{font-size:15px;font-weight:750;margin:0 0 13px}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow input{flex:1;width:50%}
.primary{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:11px 14px;font-weight:700}
.counterlist{display:flex;flex-direction:column;gap:8px}
.counteritem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}
.counteritem.active{border-color:var(--accent);background:var(--accent2)}
.itemname{font-weight:700;font-size:14px}.itemmeta{font-size:12px;color:var(--muted);margin-top:3px}
.itemactions{display:flex;gap:6px;align-items:center}.itemactions button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:7px 9px;font-size:12px}
.history{display:flex;flex-direction:column;gap:9px}.historyrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:9px}.historyrow:last-child{border:0;padding:0}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:12px}
.settings{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px}.toggle{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:20px;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17231d;color:white;padding:10px 15px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:600px){.app{padding-top:32px}.panel{padding:22px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo">☾</div><div><h1>Zikirmatik</h1><div class="sub">Sade, sakin ve sana özel</div></div></div>
 <button class="iconbtn" id="themeBtn" aria-label="Karanlık modu değiştir">🌙</button>
</header>

<section class="panel">
 <div class="row"><span class="label">Aktif zikir</span><select id="activeSelect" aria-label="Sayaç seç"></select></div>
 <div class="countarea">
  <div class="goaltext" id="counterName">Subhanallah</div>
  <div class="count" id="count">0</div>
  <div class="goaltext" id="goalLabel">Hedef: 33</div>
  <div class="progress"><div id="progressBar"></div></div>
  <div class="actions">
   <button class="action minus" id="minusBtn" aria-label="Bir azalt">−</button>
   <button class="action plus" id="plusBtn" aria-label="Bir artır">+ SAY</button>
   <button class="reset" id="resetBtn">Sıfırla</button>
  </div>
  <div class="tools">
   <button class="smallbtn" id="completeBtn">✓ Turu tamamla</button>
   <button class="smallbtn" id="undoBtn">↶ Son işlemi geri al</button>
  </div>
 </div>
 <div class="settings">
  <label class="toggle"><input type="checkbox" id="soundToggle" checked> Ses</label>
  <label class="toggle"><input type="checkbox" id="vibrateToggle" checked> Titreşim</label>
 </div>
</section>

<section class="panel">
 <div class="row"><h2 class="sectiontitle">Sayaçlarım</h2><span class="label" id="counterTotal">1 sayaç</span></div>
 <div class="counterlist" id="counterList"></div>
 <div class="addrow"><input id="newName" type="text" maxlength="32" placeholder="Yeni zikir adı"><input id="newGoal" type="number" min="1" max="999999" value="33" aria-label="Hedef" style="width:82px;flex:0 0 82px"><button class="primary" id="addBtn">Ekle</button></div>
 <div class="sub" style="margin-top:7px">Yeni sayaç eklerken hedef sayısını da belirleyebilirsin.</div>
</section>

<section class="panel">
 <div class="row"><h2 class="sectiontitle">Geçmiş</h2><button class="smallbtn" id="clearHistory">Temizle</button></div>
 <div class="history" id="historyList"><div class="empty">Henüz tamamlanan tur yok.</div></div>
</section>
<div class="note">Verilerin bu cihazın tarayıcısında saklanır. Tarayıcı verilerini temizlersen sayaç geçmişin de silinebilir.</div>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY='zikirmatik_v1';
const defaults={counters:[{id:'c1',name:'Subhanallah',count:0,goal:33}],active:'c1',history:[],dark:false,sound:true,vibrate:true};
let data;
try{data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};}catch(e){data=structuredClone(defaults)}
if(!Array.isArray(data.counters)||!data.counters.length)data.counters=structuredClone(defaults.counters);
if(!data.counters.some(c=>c.id===data.active))data.active=data.counters[0].id;
let undoStack=[];
const $=id=>document.getElementById(id);
const active=()=>data.counters.find(c=>c.id===data.active)||data.counters[0];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function feedback(){if(data.vibrate&&navigator.vibrate)navigator.vibrate(18);if(data.sound){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=740;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.045);o.onended=()=>ctx.close()}catch(e){}}}
function render(){
 const c=active();document.body.classList.toggle('dark',!!data.dark);$('themeBtn').textContent=data.dark?'☀️':'🌙';
 $('activeSelect').innerHTML=data.counters.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('activeSelect').value=c.id;
 $('counterName').textContent=c.name;$('count').textContent=c.count.toLocaleString('tr-TR');$('goalLabel').textContent=`Hedef: ${c.goal.toLocaleString('tr-TR')} · ${Math.min(100,Math.round(c.count/c.goal*100))}%`;
 $('progressBar').style.width=Math.min(100,c.count/c.goal*100)+'%';
 $('counterTotal').textContent=`${data.counters.length} sayaç`;
 $('soundToggle').checked=data.sound;$('vibrateToggle').checked=data.vibrate;
 $('counterList').innerHTML=data.counters.map(x=>`<div class="counteritem ${x.id===data.active?'active':''}"><div style="min-width:0;flex:1;cursor:pointer" data-select="${esc(x.id)}"><div class="itemname">${esc(x.name)}</div><div class="itemmeta">${x.count.toLocaleString('tr-TR')} / ${x.goal.toLocaleString('tr-TR')}</div></div><div class="itemactions"><button data-edit="${esc(x.id)}">Hedef</button>${data.counters.length>1?`<button data-delete="${esc(x.id)}" aria-label="Sayacı sil">✕</button>`:''}</div></div>`).join('');
 $('historyList').innerHTML=data.history.length?data.history.slice(0,20).map(h=>`<div class="historyrow"><span>${esc(h.name)} · ${esc(h.date)}</span><strong>${h.amount} kez</strong></div>`).join(''):'<div class="empty">Henüz tamamlanan tur yok.</div>';
 save();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function change(n){const c=active();if(n<0&&c.count===0)return;undoStack.push({id:c.id,count:c.count});if(undoStack.length>30)undoStack.shift();c.count=Math.max(0,c.count+n);render();if(n>0)feedback()}
$('plusBtn').onclick=()=>change(1);$('minusBtn').onclick=()=>change(-1);
$('resetBtn').onclick=()=>{if(!confirm('Bu sayacı sıfırlamak istiyor musun?'))return;const c=active();undoStack.push({id:c.id,count:c.count});c.count=0;render()};
$('undoBtn').onclick=()=>{const u=undoStack.pop();if(!u)return toast('Geri alınacak işlem yok.');const c=data.counters.find(x=>x.id===u.id);if(c)c.count=u.count;render()};
$('completeBtn').onclick=()=>{const c=active();if(c.count===0)return toast('Önce biraz zikir say.');data.history.unshift({name:c.name,amount:c.count,date:new Date().toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'})});c.count=0;render();toast('Tur geçmişe kaydedildi.')};
$('activeSelect').onchange=e=>{data.active=e.target.value;render()};
$('addBtn').onclick=()=>{const name=$('newName').value.trim(),goal=Math.max(1,Math.min(999999,Number($('newGoal').value)||33));if(!name)return toast('Lütfen sayaç adı yaz.');const c={id:'c'+Date.now(),name,count:0,goal};data.counters.push(c);data.active=c.id;$('newName').value='';render();toast('Yeni sayaç eklendi.')};
$('counterList').onclick=e=>{const s=e.target.closest('[data-select]'),ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(s){data.active=s.dataset.select;render()}if(ed){const c=data.counters.find(x=>x.id===ed.dataset.edit);const v=prompt('Yeni hedef sayısı:',c.goal);if(v!==null){const n=Number(v);if(Number.isInteger(n)&&n>0&&n<=999999)c.goal=n;else toast('Geçerli bir hedef gir.');render()}}if(del){const c=data.counters.find(x=>x.id===del.dataset.delete);if(confirm(`"${c.name}" sayacı silinsin mi?`)){data.counters=data.counters.filter(x=>x.id!==c.id);if(data.active===c.id)data.active=data.counters[0].id;render()}}};
$('themeBtn').onclick=()=>{data.dark=!data.dark;render()};
$('soundToggle').onchange=e=>{data.sound=e.target.checked;save()};$('vibrateToggle').onchange=e=>{data.vibrate=e.target.checked;save()};
$('clearHistory').onclick=()=>{if(confirm('Tüm geçmiş silinsin mi?')){data.history=[];render()}};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key===' '||e.key==='Enter'){e.preventDefault();change(1)}if(e.key==='Backspace')change(-1)});
render();
</script>
</body>
</html>
